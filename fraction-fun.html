<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fraction Fun</title>
<style>
:root{--bg:#FFF1C9;--card:#fff;--ink:#1E2A4A;--soft:#5B6B8C;--pri:#E8553F;--pri-d:#B53A27;--sun:#FFC93C;--green:#439829;--line:#F0D78C;--ok:#E3F7EC;--bad:#FDE8E4;--stone:#F6F1E0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A2310;--card:#3A3118;--ink:#FFF7DD;--soft:#D9CC9C;--line:#5C4F22;--ok:#17402D;--bad:#4A2420;--stone:#4A3F1E}}
:root[data-theme="dark"]{--bg:#2A2310;--card:#3A3118;--ink:#FFF7DD;--soft:#D9CC9C;--line:#5C4F22;--ok:#17402D;--bad:#4A2420;--stone:#4A3F1E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next Rounded","Trebuchet MS","Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
main{max-width:860px;margin:0 auto;padding:16px 14px 32px}
h1{font-size:clamp(30px,7vw,44px);margin:6px 0;line-height:1.1}
h2{font-size:24px;margin:0 0 6px;line-height:1.3}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 4px 0 var(--line)}
.big{font-size:72px;line-height:1;text-align:center}
.btn{border:0;border-radius:18px;padding:14px 22px;font-weight:800;font-size:20px;background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--pri-d)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pri-d)}
.btn.alt{background:var(--sun);color:#1E2A4A;box-shadow:0 5px 0 #D9A400}
.who{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.who .btn{min-width:200px;font-size:22px}
.center{text-align:center}.soft{color:var(--soft)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px;margin-bottom:8px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:var(--card);font-size:13px;font-weight:800;padding:0}
.dot.done{background:var(--pri);border-color:var(--pri-d);color:#fff}
.dot.cur{border-color:var(--ink);transform:scale(1.15)}
.tag{display:inline-block;background:#8E5CF0;color:#fff;border-radius:12px;padding:3px 10px;font-weight:800;font-size:14px}
.stage{position:relative;background:#fff;color:#1E2A4A;border-radius:16px;padding:34px 12px;margin:10px 0;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center;min-height:160px}
.stage::before,.stage::after{content:"";position:absolute;left:10px;right:10px;height:16px;background:repeating-linear-gradient(90deg,#C4C4C4 0 16px,transparent 16px 34px)}
.stage::before{top:8px}.stage::after{bottom:8px}
.word{font-size:clamp(28px,6vw,46px);font-weight:700;text-align:center;line-height:1.2}
.cmp{display:flex;flex-direction:column;gap:12px;align-items:center}
.cmp div{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800}
.grp{display:flex;flex-wrap:wrap;gap:4px;width:92px;padding:6px;border:3px solid #999;border-radius:12px;justify-content:center}
.grp i{width:20px;height:20px;border-radius:50%;background:#D8D8D8;border:2px solid #888;display:block}
.grp.on i{background:var(--green);border-color:#2B6618}
.qt{font-size:clamp(20px,4.5vw,28px);font-weight:800;text-align:center;margin:6px 0}
.grid{display:grid;gap:10px;margin:12px 0}
.g10{grid-template-columns:repeat(5,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g1{grid-template-columns:1fr}
@media (max-width:620px){.g10{grid-template-columns:repeat(2,1fr)}}
.o{height:68px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:clamp(24px,5vw,34px);font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.28);position:relative}
.g3 .o{height:84px;font-size:46px}
.g1 .o{height:62px;font-size:clamp(20px,4.5vw,28px)}
.o:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.o.sel{outline:6px solid var(--ink);outline-offset:2px}
.o.sel::after{content:"✓";position:absolute;top:2px;right:8px;font-size:18px}
.nav{display:flex;justify-content:space-between;gap:10px}
.msg{min-height:24px;text-align:center;font-weight:700;color:var(--pri);margin:4px 0}
.wrong{background:var(--bad);border-radius:18px;padding:14px;margin:10px 0}
.wrong .stage{min-height:0;padding:30px 8px;transform:scale(.9)}
.wrong p{margin:6px 0}
.yours{color:var(--pri);text-decoration:line-through;font-weight:800}
.right{color:#2FAE6B;font-weight:900}
.okbox{background:var(--ok);border-radius:18px;padding:12px;margin:10px 0;font-weight:700}
.hop{display:inline-block;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.hop{animation:none}}
</style>
</head>
<body>
<main>
<section id="s-start" class="card center">
  <div class="big hop">🍕</div>
  <h1>Fraction Fun</h1>
  <p class="soft" style="font-size:19px">Share things equally, find equal fractions, and compare them with &lt;, = and &gt;.</p>
  <p style="font-weight:800">Who is playing?</p>
  <div class="who">
    <button class="btn" data-p="Essa">Essa (Class III)</button>
    <button class="btn alt" data-p="Musa">Musa (Class IV)</button>
  </div>
</section>

<section id="s-quiz" hidden>
  <div class="top"><span id="tm">⏱ 0:00</span><span id="lv"></span><span id="ck">✓ 0</span></div>
  <div class="dots" id="dots"></div>
  <div class="card">
    <div class="center soft" id="qn" style="font-weight:800"></div>
    <div class="qt" id="qt"></div>
    <div class="stage" id="vis"></div>
    <div class="grid" id="opts"></div>
    <div class="msg" id="msg"></div>
    <div class="nav">
      <button class="btn alt" id="back">Back</button>
      <button class="btn" id="next">Next</button>
    </div>
  </div>
</section>

<section id="s-result" hidden>
  <div class="card center">
    <div class="big" id="r-emoji"></div>
    <h1 id="r-score"></h1>
    <p id="r-time" class="soft" style="font-weight:800"></p>
    <p id="r-msg" style="font-size:19px;font-weight:700"></p>
  </div>
  <div id="r-list"></div>
  <div class="center" style="margin-top:16px"><button class="btn" id="again">Try again with new questions</button></div>
</section>
</main>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a*b/gcd(a,b);
const kk=(n,d)=>{const g=gcd(n,d);return n/g+"/"+d/g};
const fs=f=>f[0]+"/"+f[1];
const cmp=(x,y)=>{const v=x[0]*y[1]-y[0]*x[1];return v>0?">":v<0?"<":"="};
const GREEN="#439829";
const COLS=["#E8553F","#3F9BE8","#7B3FE4","#C25BD8","#3F9BE8","#4DB887","#3C8A55","#D13B47","#F28C28","#2B3FD1"];
let L,Q=[],A=[],cur=0,warned=false,t0=0,timer=null;
const used=new Set();
const DENS=()=>L.hard?[2,3,4,5,6,8,10,12]:[2,3,4,6,8];

function bar(n,d,w=300){
  const h=40,u=(w-4)/d;let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" style="max-width:100%">`;
  for(let i=0;i<d;i++)s+=`<rect x="${2+i*u}" y="2" width="${u}" height="${h-4}" fill="${i<n?GREEN:"#fff"}" stroke="#000" stroke-width="2.5"/>`;
  return s+"</svg>";
}
function circ(n,d){
  const r=70,c=75;let s=`<svg viewBox="0 0 150 150" width="170">`;
  for(let i=0;i<d;i++){
    const a=-Math.PI/2+i*2*Math.PI/d,b=a+2*Math.PI/d;
    s+=`<path d="M${c} ${c}L${c+r*Math.cos(a)} ${c+r*Math.sin(a)}A${r} ${r} 0 0 1 ${c+r*Math.cos(b)} ${c+r*Math.sin(b)}Z" fill="${i<n?GREEN:"#fff"}" stroke="#000" stroke-width="3" stroke-linejoin="round"/>`;
  }
  return s+"</svg>";
}
function numOpts(ans,ex){
  const s=new Set();
  [...ex,ans+1,ans-1,ans+2,ans-2,ans+3].forEach(v=>{if(v>0&&v!==ans&&Number.isInteger(v))s.add(v)});
  for(let x=1;s.size<12;x++)if(x!==ans)s.add(x);
  return shuf([ans,...shuf([...s]).slice(0,9)]).map(String);
}
function pool(dens){const p=[];dens.forEach(d=>{for(let n=1;n<d;n++)p.push([n,d])});return p}
function fracOpts(c,avoid){
  const seen=new Set([kk(c[0],c[1])]);(avoid||[]).forEach(a=>seen.add(kk(a[0],a[1])));
  const out=[fs(c)];
  for(const f of shuf(pool(DENS()))){if(out.length>=9)break;const k=kk(f[0],f[1]);if(!seen.has(k)){seen.add(k);out.push(fs(f))}}
  out.push("1");return shuf(out);
}
function conv(list){const l=list.reduce((a,f)=>lcm(a,f[1]),1);return list.map(f=>`${fs(f)} = ${f[0]*l/f[1]}/${l}`).join(", ")}
const Qn=(text,vis,opts,ans,explain,cls,extra)=>Object.assign({text,vis,opts,ans,explain,cls:cls||"g10"},extra);

function gShade(){
  const d=pick(DENS()),n=R(1,d-1),circle=d<=8&&Math.random()<.5;
  return Qn("Which fraction is the green area?",(circle?circ(n,d):bar(n,d,320))+`<div class="word">green area</div>`,fracOpts([n,d]),`${n}/${d}`,`The shape is split into ${d} equal parts and ${n} of them are green, so the green area is ${n}/${d}.`);
}
function gCount(){
  const d=pick(L.hard?[2,3,4,5,6,8]:[2,3,4,5]),k=R(1,Math.min(6,Math.floor(36/d))),T=d*k;
  let v="";for(let g=0;g<d;g++)v+=`<div class="grp ${g?"":"on"}">`+"<i></i>".repeat(k)+"</div>";
  return Qn(`What is 1/${d} of ${T}?  (${T} counters in ${d} equal groups)`,v,numOpts(k,[T,2*k,T-k]),String(k),`1/${d} of ${T} means share ${T} into ${d} equal groups. ${T} ÷ ${d} = ${k}.`);
}
function gOper(){
  const d=pick(L.hard?[2,3,4,5,6,8,10]:[2,3,4,5,10]),k=R(2,L.hard?12:10),T=d*k,m=Math.random()<.4;
  return Qn(m?`1/${d} of AED ${T} = ?`:`What is 1/${d} of ${T}?`,`<div class="word">1/${d} of ${m?"AED ":""}${T} = ?</div>`,numOpts(k,[T,2*k,T-k,k+d]),String(k),`1/${d} of ${T} is ${T} ÷ ${d} = ${k}.`);
}
function equivs(){
  const r=[];DENS().forEach(c=>{for(let b=1;b<c;b++)if(gcd(b,c)===1)for(let m=2;c*m<=(L.hard?12:8);m++)if(DENS().includes(c*m))r.push([b,c,m])});return pick(r);
}
function gEquiv(){
  const [b,c,m]=equivs(),rev=Math.random()<.5,shown=rev?[b,c]:[b*m,c*m],ans=rev?[b*m,c*m]:[b,c];
  return Qn(`Which fraction is equal to ${fs(shown)}?`,bar(shown[0],shown[1],320)+`<div class="word">${fs(shown)}</div>`,fracOpts(ans,[shown]),fs(ans),`${fs(shown)} and ${fs(ans)} cover the same part of the bar. ${rev?`Multiply top and bottom by ${m}`:`Divide top and bottom by ${m}`}: ${fs(shown)} = ${fs(ans)}.`);
}
function gMissing(){
  const [b,c,m]=equivs(),top=Math.random()<.5,ans=top?b*m:c*m;
  const v=L.hard?"":bar(b,c,260)+bar(b*m,c*m,260);
  return Qn(top?`${b}/${c} = ?/${c*m}`:`${b}/${c} = ${b*m}/?`,v+`<div class="word">${top?`${b}/${c} = ?/${c*m}`:`${b}/${c} = ${b*m}/?`}</div>`,numOpts(ans,[b*m,c*m,b,c]),String(ans),`The same number multiplies the top and the bottom. ${c} × ${m} = ${c*m}, so ${b} × ${m} = ${b*m}. ${b}/${c} = ${b*m}/${c*m}.`);
}
function cmpQ(x,y,hint){
  const a=cmp(x,y);
  return Qn(`Which symbol makes this true?   ${fs(x)}  ?  ${fs(y)}`,`<div class="cmp"><div>${fs(x)} ${bar(x[0],x[1],240)}</div><div>${fs(y)} ${bar(y[0],y[1],240)}</div></div>`,["<","=",">"],a,`${conv([x,y])}. So ${fs(x)} ${a} ${fs(y)}.${hint||""}`,"g3");
}
function gUnitCmp(){
  const ds=shuf(DENS()).slice(0,2);
  return cmpQ([1,ds[0]],[1,ds[1]]," A bigger bottom number means smaller pieces.");
}
function gCmp(){
  if(Math.random()<.55){const [b,c,m]=equivs(),x=[b,c],y=[b*m,c*m];return Math.random()<.5?cmpQ(x,y):cmpQ(y,x)}
  for(;;){
    const d1=pick(L.hard?DENS():[2,4,8]),d2=pick(L.hard?DENS():[2,4,8]),x=[R(1,d1-1),d1],y=[R(1,d2-1),d2];
    if(d1!==d2&&cmp(x,y)!=="=")return cmpQ(x,y);
  }
}
function fracSet(k,mode){
  for(;;){
    let s;
    if(mode==="unit")s=shuf(DENS()).slice(0,k).map(d=>[1,d]);
    else if(mode==="same"){const ds=DENS().filter(d=>d>k),d=pick(ds);s=shuf([...Array(d-1).keys()].map(i=>i+1)).slice(0,k).map(n=>[n,d])}
    else{const ds=L.hard?DENS():[2,4,8];s=[];for(let i=0;i<k;i++){const d=pick(ds);s.push([R(1,d-1),d])}}
    if(new Set(s.map(f=>kk(f[0],f[1]))).size===k)return s;
  }
}
function gExtreme(){
  const big=Math.random()<.5,s=fracSet(3,pick(["unit","same"])),sorted=[...s].sort((x,y)=>cmp(x,y)===">"?1:-1),a=big?sorted[2]:sorted[0];
  return Qn(`Which fraction is the ${big?"greatest":"smallest"}?`,`<div class="word">${s.map(fs).join("   ")}</div>`,shuf(s.map(fs)),fs(a),`${conv(s)}. The ${big?"greatest":"smallest"} is ${fs(a)}.`,"g3");
}
function gOrder(k,mode,star){
  const s=fracSet(k,mode),asc=[...s].sort((x,y)=>cmp(x,y)===">"?1:-1),good=asc.map(fs).join(",  ");
  const bad=new Set([asc.slice().reverse().map(fs).join(",  ")]);
  for(let t=0;bad.size<2&&t<50;t++){const p=shuf(asc).map(fs).join(",  ");if(p!==good)bad.add(p)}
  return Qn(`${star?"Star Challenge: ":""}Put these in order, smallest first:`,`<div class="word">${shuf(s).map(fs).join("   ")}</div>`,shuf([good,...bad]),good,`${conv(s)}. From smallest to biggest: ${good}.`,"g1",{star});
}
const SLOTS=[gShade,gCount,gOper,gEquiv,gMissing,gUnitCmp,gCmp,gExtreme,()=>gOrder(3,pick(["unit","same"])),()=>gOrder(L.hard?4:3,"mixed",true)];
function makeSet(){
  const here=new Set();
  return SLOTS.map(f=>{let q,t=0;do{q=f();q.sig=q.text+q.vis;t++}while((used.has(q.sig)||here.has(q.sig))&&t<80);used.add(q.sig);here.add(q.sig);return q});
}
const $=id=>document.getElementById(id);
function show(id){["s-start","s-quiz","s-result"].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
const full=i=>A[i]!=="";
const clock=()=>{const s=Math.floor((Date.now()-t0)/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

function start(p){
  if(p)L={name:p,hard:p==="Musa"};
  Q=makeSet();A=Q.map(()=>"");cur=0;warned=false;t0=Date.now();
  clearInterval(timer);timer=setInterval(()=>{$("tm").textContent="⏱ "+clock()},1000);
  show("s-quiz");draw();
}
function draw(){
  const q=Q[cur],last=cur===Q.length-1;
  $("qn").textContent=`Question ${cur+1} of ${Q.length}`;
  $("lv").innerHTML=q.star?'<span class="tag">⭐ Star Challenge</span>':"";
  $("ck").textContent="✓ "+Q.filter((_,i)=>full(i)).length;
  $("dots").innerHTML=Q.map((_,i)=>`<button class="dot ${full(i)?"done":""} ${i===cur?"cur":""}" data-i="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`).join("");
  $("qt").textContent=q.text.replace("Star Challenge: ","");
  $("vis").innerHTML=q.vis;
  $("opts").className="grid "+q.cls;
  $("opts").innerHTML=q.opts.map((o,i)=>`<button class="o ${A[cur]===o?"sel":""}" style="--c:${COLS[i%COLS.length]}" data-o="${o}">${o}</button>`).join("");
  $("back").style.visibility=cur===0?"hidden":"visible";
  $("next").textContent=last?"Finish ✅":"Next";
  $("msg").textContent="";
}
function finish(){
  const open=Q.map((_,i)=>i).filter(i=>!full(i));
  if(open.length&&!warned){warned=true;$("msg").textContent=`Question ${open.map(i=>i+1).join(", ")} not answered yet. Tap its number to go back, or tap Finish again to check anyway.`;return}
  result();
}
function result(){
  clearInterval(timer);
  const wrong=[];let score=0;
  Q.forEach((q,i)=>{if(A[i]===q.ans)score++;else wrong.push(i)});
  $("r-emoji").textContent=score===10?"🏆":score>=8?"🌟":score>=5?"🍕":"💪";
  $("r-score").textContent=`${score} out of ${Q.length}`;
  $("r-time").textContent=`Time: ${clock()}`;
  $("r-msg").textContent=score===10?`Perfect, ${L.name}! You are a fraction champion!`:score>=8?`Brilliant, ${L.name}! Just a few to look at.`:score>=5?`Good job, ${L.name}! Let's look at the tricky ones.`:`Great effort, ${L.name}! Every mistake helps you learn. Have a look and try again.`;
  let h="";
  if(!wrong.length)h=`<div class="okbox">No mistakes. Amazing work, ${L.name}!</div>`;
  else{
    h='<h2 style="margin-top:16px">Let\'s check these</h2>';
    wrong.forEach(i=>{const q=Q[i];
      h+=`<div class="wrong"><b>Question ${i+1}</b><p>${q.text}</p><div class="stage">${q.vis}</div><p>Your answer: <span class="yours">${A[i]===""?"no answer":A[i]}</span></p><p>Correct answer: <span class="right">${q.ans}</span></p><p class="soft">${q.explain}</p></div>`;
    });
  }
  $("r-list").innerHTML=h;show("s-result");
}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>start(b.dataset.p));
$("again").onclick=()=>start();
$("back").onclick=()=>{if(cur>0){cur--;warned=false;draw()}};
$("next").onclick=()=>{if(cur<Q.length-1){cur++;warned=false;draw()}else finish()};
$("dots").onclick=e=>{const b=e.target.closest("[data-i]");if(b){cur=+b.dataset.i;warned=false;draw()}};
$("opts").onclick=e=>{const o=e.target.closest("[data-o]");if(o){A[cur]=o.dataset.o;warned=false;draw()}};
</script>
</body>
</html>
